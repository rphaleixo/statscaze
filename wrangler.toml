name = "statscaze"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Serve os arquivos de public/ para qualquer rota que não seja /api/*
[assets]
directory = "public"
binding = "ASSETS"

# Preencha depois de criar o banco com:
#   npx wrangler d1 create statscaze
[[d1_databases]]
binding = "DB"
database_name = "statscaze"
database_id = "78573859-f9ef-4917-8361-05f5d77bc2e5"

# Coleta automática diária (ajuste o horário se quiser). UTC.
[triggers]
crons = ["0 6 * * *"]

# IA da própria Cloudflare (Workers AI), usada para sugerir a
# competição/programa de cada vídeo. Sem chave extra, sem custo por fora.
[ai]
binding = "AI"

[vars]
CHANNEL_HANDLE = "CazeTV"

# A chave da API do YouTube NÃO fica aqui — configure com:
#   npx wrangler secret put YOUTUBE_API_KEY
